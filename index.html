<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TO-DO list</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">TO-DO list</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main container -->
  <div class="container">
    <div class="row g-4">
      <!-- Left column: To-Do app -->
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">To‑Do</h5>

            <!-- Input -->
            <form id="taskForm" class="row gy-2 gx-2 align-items-center mb-3" onsubmit="return false;">
              <div class="col-sm">
                <input id="taskInput" class="form-control" placeholder="Добавить задачу..." maxlength="150" required>
              </div>
              <div class="col-auto">
                <select id="prioritySelect" class="form-select">
                  <option value="low">Zems</option>
                  <option value="medium" selected>Videjais</option>
                  <option value="high">Augsts</option>
                </select>
              </div>
              <div class="col-auto">
                <button id="addButton" class="btn btn-success">Pievienot</button>
              </div>
            </form>

            <!-- Filters + counts -->
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="btn-group" role="group" id="filters">
                <button class="btn btn-outline-primary active" data-filter="all">Visi</button>
                <button class="btn btn-outline-primary" data-filter="active">Atkivi</button>
                <button class="btn btn-outline-primary" data-filter="completed">Gatavs</button>
              </div>
              <div>
                <span class="me-2">Kopa: <span id="totalCount" class="fw-bold">0</span></span>
                <span>Gatavs: <span id="doneCount" class="fw-bold">0</span></span>
              </div>
            </div>

            <!-- Task list -->
            <ul id="taskList" class="list-group"></ul>

            <!-- Empty placeholder -->
            <div id="emptyPlaceholder" class="text-center text-muted mt-3" style="display:none;">
              Pievienojiet uzdevumu.
            </div>
          </div>
        </div>
      </div>


  <!-- Task detail modal -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="modalTitle" class="modal-title">Detalas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <p id="modalBody"></p>
          <p class="mb-0"><strong>Prioritate:</strong> <span id="modalPriority"></span></p>
          <p class="mb-0"><strong>Status:</strong> <span id="modalStatus"></span></p>
        </div>
        <div class="modal-footer">
          <button id="modalClose" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App script -->
  <script src="script.js" defer></script>
</body>
</html>
